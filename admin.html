<!doctype html>
<html lang="en">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1" /><meta name="robots" content="noindex,nofollow" /><title>Acerbox | Review Dashboard</title><link rel="icon" href="./assets/logo/acerbox-logo-transparent.png" /><link rel="preconnect" href="https://fonts.googleapis.com" /><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet" /></head>
<body class="admin-page">
  <header class="admin-header shell"><a href="./" aria-label="Acerbox home"><img src="./assets/logo/acerbox-logo-transparent.png" alt="Acerbox" /></a><span>Review dashboard</span><button type="button" class="availability-refresh" data-logout hidden>Sign out</button></header>
  <main class="shell">
    <form class="acerbox-form admin-login" data-login-form><p class="eyebrow">Jake / Sign in</p><h1>LET’S<br />MANAGE.</h1><label for="admin-user">Username</label><input id="admin-user" name="username" autocomplete="username" required maxlength="100" /><label for="admin-password">Password</label><input id="admin-password" type="password" name="password" autocomplete="current-password" required maxlength="200" /><p class="form-feedback" role="status" data-feedback></p><button class="button button-primary" type="submit"><span>Sign in</span><b>↗</b></button></form>
    <div data-admin-content hidden>
      <h1>CLIENT WORDS.<br /><span>YOUR CALL.</span></h1>
      <p class="feature-note">Approve, unpublish or delete client reviews. Booking requests are handled manually by email.</p>
      <p class="form-feedback" role="status" data-admin-feedback></p>
      <section class="admin-section" id="admin-reviews" aria-labelledby="admin-reviews-title"><div class="admin-section-heading"><h2 id="admin-reviews-title">REVIEWS</h2><label>Show <select data-review-filter><option value="pending">Pending</option><option value="approved">Approved</option><option value="all">All</option></select></label></div><div data-admin-reviews></div></section>
      <p class="feature-note">Shows up to 500 reviews. Only approved reviews appear publicly.</p>
    </div>
  </main><script type="module" src="/src/js/admin.js"></script>
</body></html>
